<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Sky -->
  <rect width="32" height="32" rx="6" fill="#4FC3F7"/>

  <!-- Sun -->
  <rect x="24" y="2" width="6" height="2" fill="#FFD54F"/>
  <rect x="22" y="4" width="8" height="2" fill="#FFD54F"/>
  <rect x="24" y="6" width="6" height="2" fill="#FFD54F"/>

  <!-- Cloud -->
  <rect x="4" y="4" width="6" height="2" fill="#E1F5FE"/>
  <rect x="2" y="6" width="10" height="2" fill="#FFFFFF"/>
  <rect x="4" y="8" width="6" height="2" fill="#E1F5FE"/>

  <!-- Ground -->
  <rect x="0" y="20" width="32" height="12" rx="0" fill="#43A047"/>
  <rect x="0" y="22" width="32" height="10" fill="#388E3C"/>
  <rect x="0" y="26" width="32" height="6" fill="#2E7D32"/>

  <!-- Barn roof -->
  <rect x="14" y="8" width="4" height="2" fill="#C62828"/>
  <rect x="12" y="10" width="8" height="2" fill="#D32F2F"/>
  <rect x="10" y="12" width="12" height="2" fill="#E53935"/>

  <!-- Barn walls -->
  <rect x="10" y="14" width="12" height="8" fill="#E57373"/>
  <!-- Barn wall darker edges -->
  <rect x="10" y="14" width="2" height="8" fill="#D32F2F"/>
  <rect x="20" y="14" width="2" height="8" fill="#D32F2F"/>

  <!-- Barn door -->
  <rect x="14" y="16" width="4" height="6" fill="#5D4037"/>
  <rect x="14" y="16" width="4" height="2" fill="#4E342E"/>

  <!-- Barn windows -->
  <rect x="11" y="15" width="2" height="2" fill="#FFF9C4"/>
  <rect x="19" y="15" width="2" height="2" fill="#FFF9C4"/>

  <!-- Barn X detail on door -->
  <rect x="14" y="18" width="1" height="1" fill="#3E2723"/>
  <rect x="17" y="18" width="1" height="1" fill="#3E2723"/>
  <rect x="15" y="19" width="2" height="1" fill="#3E2723"/>
  <rect x="14" y="20" width="1" height="1" fill="#3E2723"/>
  <rect x="17" y="20" width="1" height="1" fill="#3E2723"/>

  <!-- Fence left -->
  <rect x="3" y="18" width="2" height="4" fill="#8D6E63"/>
  <rect x="6" y="18" width="2" height="4" fill="#8D6E63"/>
  <rect x="3" y="19" width="5" height="1" fill="#A1887F"/>

  <!-- Fence right -->
  <rect x="24" y="18" width="2" height="4" fill="#8D6E63"/>
  <rect x="27" y="18" width="2" height="4" fill="#8D6E63"/>
  <rect x="24" y="19" width="5" height="1" fill="#A1887F"/>

  <!-- Flowers/crops on ground -->
  <rect x="2" y="23" width="2" height="2" fill="#66BB6A"/>
  <rect x="5" y="24" width="1" height="1" fill="#FFEB3B"/>
  <rect x="26" y="23" width="2" height="2" fill="#66BB6A"/>
  <rect x="28" y="24" width="1" height="1" fill="#FF7043"/>
</svg>
